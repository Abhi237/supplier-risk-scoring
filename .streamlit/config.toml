[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#16213a"
textColor = "#e6edf7"
font = "sans serif"
codeFont = "monospace"
borderColor = "#24324f"
showWidgetBorder = true
baseRadius = "small"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
